<!DOCTYPE html>
<html>
<head>
    <title>Student Management System | Java Full Stack</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 30%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 15px;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            background: #2980b9;
            transform: scale(1.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #34495e;
            color: white;
        }

        .delete-btn {
            background: red;
        }

        #message {
            color: green;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 10px;
            color: gray;
        }
    </style>
</head>

<body>

<header>
    Student Management System
</header>

<div class="container">

    <!-- Add Student -->
    <div class="card">
        <h3>Add / Update Student</h3>

        <p id="message"></p>

        <input type="text" id="name" placeholder="Name">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="course" placeholder="Course">

        <button id="submitBtn" onclick="addStudent()">Add Student</button>
    </div>

    <!-- Student List -->
    <div class="card">
        <h3>Student List</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>

</div>

<footer>
    © 2026 Student Management System | Developed by Isha Raut
</footer>

<script src="js/script.js"></script>

</body>
</html>
